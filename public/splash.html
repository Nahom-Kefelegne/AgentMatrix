<!DOCTYPE html>
<html>
<body style="margin:0;background:#08080f;display:flex;align-items:center;justify-content:center;height:100vh;font-family:-apple-system,BlinkMacSystemFont,sans-serif">
  <div style="display:flex;align-items:center;gap:14px">
    <div style="width:14px;height:14px;border-radius:50%;background:#51cf66;animation:pulse 2.5s ease-in-out infinite"></div>
    <span style="color:#eee;font-size:28px;font-weight:800;letter-spacing:-0.5px">Agent Matrix</span>
  </div>
  <style>@keyframes pulse{0%,100%{opacity:.3;box-shadow:0 0 4px rgba(81,207,102,.1)}50%{opacity:1;box-shadow:0 0 24px rgba(81,207,102,.7),0 0 8px rgba(81,207,102,.4)}}</style>
</body>
</html>
