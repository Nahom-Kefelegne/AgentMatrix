appId: com.agentmatrix.app
productName: Agent Matrix

asar: true
asarUnpack:
  - "node_modules/node-pty/**/*"
  - ".next/standalone/**/*"
  - ".next/static/**/*"
  - "public/**/*"

directories:
  output: dist
  buildResources: build

files:
  - "electron/**/*"
  - "lib/**/*"
  - "app/**/*"
  - "public/**/*"
  - ".next/**/*"
  - "server.ts"
  - "next.config.ts"
  - "package.json"
  - "node_modules/**/*"

mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools

win:
  target: nsis

linux:
  target:
    - AppImage
    - deb

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
